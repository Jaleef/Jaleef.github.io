<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现代 · 简约模板</title>
  <!-- 温和的字体与基础样式 -->
  <style>
    /* 全局重置与变量 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f9faff 0%, #eef1fa 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
      color: #1e1e2f;
    }

    /* 主卡片容器 —— 柔和阴影，细腻圆角 */
    .card {
      max-width: 900px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2.5rem;
      padding: 2.5rem 2.2rem;
      box-shadow: 
        0 25px 40px -12px rgba(0, 20, 50, 0.15),
        0 8px 18px -6px rgba(0, 0, 0, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 
        0 30px 50px -16px rgba(0, 25, 60, 0.2),
        0 12px 24px -8px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
    }

    /* 标题区 */
    h1 {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background: linear-gradient(135deg, #1e2b4f 0%, #2f3e6e 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.4rem;
    }

    .subhead {
      font-size: 1.1rem;
      font-weight: 400;
      color: #4a5578;
      margin-bottom: 2rem;
      border-left: 4px solid #6d8cff;
      padding-left: 1.2rem;
      background: linear-gradient(90deg, rgba(109, 140, 255, 0.08), transparent);
      border-radius: 0 8px 8px 0;
    }

    /* 网格——展示三个特性区块 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.6rem;
      margin: 2.2rem 0 1.8rem;
    }

    .grid-item {
      background: rgba(255, 255, 255, 0.6);
      padding: 1.6rem 1.4rem;
      border-radius: 1.6rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 14px rgba(0, 15, 30, 0.04);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .grid-item:hover {
      background: #ffffff;
      box-shadow: 0 12px 22px -8px rgba(55, 85, 150, 0.12);
    }

    .grid-item h3 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #1a2442;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grid-item p {
      font-size: 0.96rem;
      color: #3e4a66;
    }

    /* 可爱的图标占位圆点，简约不单调 */
    .icon-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6d8cff;
      box-shadow: 0 0 0 3px rgba(109, 140, 255, 0.2);
    }

    /* 按钮组 */
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.2rem;
      margin-top: 2rem;
      border-top: 1px solid rgba(109, 140, 255, 0.15);
      padding-top: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2.2rem;
      font-weight: 500;
      font-size: 1rem;
      border-radius: 3rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    .btn-primary {
      background: #1a2442;
      color: white;
      box-shadow: 0 6px 16px rgba(26, 36, 66, 0.2);
    }

    .btn-primary:hover {
      background: #232f54;
      box-shadow: 0 10px 22px -4px rgba(26, 36, 66, 0.3);
      transform: scale(1.02);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(26, 36, 66, 0.2);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.7);
      color: #1a2442;
      border: 1.5px solid rgba(109, 140, 255, 0.4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .btn-outline:hover {
      background: #ffffff;
      border-color: #6d8cff;
      box-shadow: 0 8px 18px -6px rgba(109, 140, 255, 0.25);
    }

    /* 页脚温馨提醒 */
    .footer-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #6b7290;
      text-align: center;
      border-top: 1px dashed rgba(109, 140, 255, 0.2);
      padding-top: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .footer-note span {
      background: #eef1fc;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      font-weight: 500;
      color: #2f3e6e;
    }

    /* 简单的响应式调整 */
    @media (max-width: 480px) {
      .card {
        padding: 1.8rem 1.4rem;
        border-radius: 2rem;
      }

      .subhead {
        font-size: 1rem;
        padding-left: 0.8rem;
      }

      .btn {
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        width: 100%;
      }

      .actions {
        gap: 0.8rem;
      }

      .footer-note {
        flex-direction: column;
        gap: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- 标题与描述 -->
    <h1>✨ 简易 · 框架</h1>
    <div class="subhead">
      一个干净、现代的 HTML 模板，开箱即用。
    </div>

    <!-- 三个核心特性区块 -->
    <div class="grid">
      <div class="grid-item">
        <h3>
          <span class="icon-dot"></span> 轻量
        </h3>
        <p>无外部依赖，纯 HTML & CSS，瞬间加载。所有样式内聚，便于迁移和定制。</p>
      </div>
      <div class="grid-item">
        <h3>
          <span class="icon-dot"></span> 自适应
        </h3>
        <p>弹性网格与流式字体，从手机到桌面都保持舒适的阅读体验。</p>
      </div>
      <div class="grid-item">
        <h3>
          <span class="icon-dot"></span> 现代感
        </h3>
        <p>微妙的毛玻璃效果、柔和阴影与渐变，带来精致但不张扬的视觉。</p>
      </div>
    </div>

    <!-- 操作按钮区域 -->
    <div class="actions">
      <a href="#" class="btn btn-primary">开始使用</a>
      <a href="#" class="btn btn-outline">了解更多</a>
    </div>

    <!-- 页脚 / 额外信息 -->
    <div class="footer-note">
      <span>HTML 模板</span>
      可自由编辑 · 无需署名
    </div>
  </main>

  <!-- 极简的交互说明：仅用来表示模板的“活性”，无任何库 -->
  <script>
    (function() {
      // 仅仅是一个友好的控制台提示，证明模板可运行。
      // 保持完全无侵入，你可以删除或保留。
      console.log('✅ HTML 模板已加载 — 你可以随意修改内容。');
    })();
  </script>
</body>
</html>
